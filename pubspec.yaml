name: alper_cursor_remote
description: Kişisel Cursor uzaktan kontrol (Tailscale + yerel WebSocket).
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  web_socket_channel: ^3.0.3
  intl: ^0.20.2
  image_picker: ^1.2.2
  mime: ^2.0.0
  file_selector: ^1.1.0
  flutter_markdown: ^0.7.7+1
  flutter_local_notifications: ^19.0.0
  permission_handler: ^12.0.1
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: assets/branding/app_icon.png

flutter:
  uses-material-design: true

  assets:
    - assets/branding/app_icon.png
